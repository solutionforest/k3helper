name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.26.2"

jobs:
  test:
    name: Unit tests + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d ./cmd ./internal
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The integration-tagged files are never compiled by `go vet ./...`.
      # They rot silently unless type-checked explicitly — which is exactly
      # how they ended up pointing at a sandbox that no longer existed.
      - name: go vet (integration build tag)
        run: go vet -tags=integration ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all platforms
        run: make build-all

      - uses: actions/upload-artifact@v4
        with:
          name: k3helper-binaries
          path: bin/
          retention-days: 7

  # The sandbox is three OrbStack Linux VMs, which needs macOS with working
  # nested virtualization. GitHub-hosted runners cannot provide that, so this
  # job only runs on a self-hosted macOS runner labelled "orbstack", or when
  # dispatched manually against one. It is skipped everywhere else rather than
  # silently reported as passing.
  e2e:
    name: Sandbox E2E (self-hosted macOS + OrbStack)
    runs-on: [self-hosted, macOS, orbstack]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[e2e]')
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate sandbox SSH key
        run: |
          # The private key is gitignored; CI mints a throwaway pair.
          ssh-keygen -t ed25519 -f test/sandbox/ssh/id_ed25519 -N '' <<< y
          cp test/sandbox/ssh/id_ed25519.pub test/sandbox/ssh/authorized_keys

      - name: Full lifecycle E2E
        run: make e2e

      - name: Integration tests against the live sandbox
        run: go test -tags=integration -count=1 ./...

      - name: Tear down sandbox
        if: always()
        run: make sandbox-down
