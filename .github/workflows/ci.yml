name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.26.2"

jobs:
  test:
    name: Unit tests + vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l ./cmd ./internal)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d ./cmd ./internal
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The integration-tagged files are never compiled by `go vet ./...`.
      # They rot silently unless type-checked explicitly — which is exactly
      # how they ended up pointing at a sandbox that no longer existed.
      - name: go vet (integration build tag)
        run: go vet -tags=integration ./...

      - name: Unit tests
        run: go test -race -count=1 ./...

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all platforms
        run: make build-all

      - uses: actions/upload-artifact@v4
        with:
          name: k3helper-binaries
          path: bin/
          retention-days: 7

  # Sandbox E2E on the container driver.
  #
  # STATUS: unproven on a GitHub-hosted runner. The driver provisions the three
  # hosts correctly and k3s installs and reaches Ready, but on the author's
  # machine (Docker inside an OrbStack Linux VM) CoreDNS is repeatedly SIGTERMed
  # because kubelet's probes cannot reach pod IPs through flannel. Whether a
  # native Linux runner behaves the same has not been established.
  #
  # It is therefore behind workflow_dispatch: run it by hand to find out, rather
  # than having every push blocked by, or falsely reassured about, a job whose
  # outcome nobody has verified. Promote it to `push` once it passes.
  e2e:
    name: Sandbox E2E (docker driver, unproven)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 40
    env:
      SANDBOX_DRIVER: docker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # The private key is gitignored; CI mints a throwaway pair. setup-docker.sh
      # does this too, but doing it here keeps the failure obvious if it can't.
      - name: Generate a sandbox SSH key
        run: |
          ssh-keygen -q -t ed25519 -f test/sandbox/ssh/id_ed25519 -N ''
          cp test/sandbox/ssh/id_ed25519.pub test/sandbox/ssh/authorized_keys

      - name: Full lifecycle E2E
        run: make e2e

      - name: Integration tests against the live sandbox
        run: go test -tags=integration -count=1 ./...

      - name: Fault matrix
        run: make fault-check-all

      - name: Diagnostics on failure
        if: failure()
        run: |
          docker compose -f test/sandbox/docker-compose.yml ps || true
          for c in sandbox-server sandbox-agent1 sandbox-agent2; do
            echo "───── $c ─────"
            docker logs --tail 50 "$c" 2>&1 || true
            docker exec "$c" journalctl -u k3s -u k3s-agent -n 50 --no-pager 2>&1 || true
          done

      - name: Tear down sandbox
        if: always()
        run: make sandbox-down
